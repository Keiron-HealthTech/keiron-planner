name: Checks

# El disparador se copia del repo hermano; la estructura de jobs no. Un job por script
# dejaría la lista de checks escrita dos veces, en el YAML y en el runner. Acá existe una
# sola vez, en el glob, así que agregar un check no toca este archivo.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El paquete del CLI declara engines.node >= 22 y su postinstall corre node. Sin
      # este paso, una falla del instalador se leería como una falla del manifiesto.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Medido: el binario recién instalado valida y sale 0 con HOME vacío, sin
      # credencial y sin onboarding.
      - name: Instalar el CLI de Claude Code
        run: npm i -g @anthropic-ai/claude-code

      # Un intérprete 3.9 aparte, que ningún check consume todavía. Va acá porque el job
      # es único y los dos setup pesados se pagan una sola vez.
      # Entre comillas: sin comillas el YAML lo lee como número, y 3.10 sería 3.1.
      - uses: actions/setup-python@v7
        id: py39
        with:
          python-version: '3.9'

      # PY39 va como env del paso y no del job: un env de job no puede referenciar la
      # salida de un paso.
      - name: Checks estructurales
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        run: ./scripts/run-checks.sh
